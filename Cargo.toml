[package]
name = "send-latency-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Head-to-head benchmark of Solana transaction send paths"
repository = "https://github.com/Lusitaniae/send-latency-monitor"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
clickhouse = { version = "0.15", features = ["rustls-tls-ring", "rustls-tls-webpki-roots", "time", "uuid"] }
dotenvy = "0.15"
futures = "0.3"
humantime-serde = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-compute-budget-interface = "3"
solana-hash = "4"
solana-keypair = "4"
solana-message = "6"
solana-pubkey = "4"
solana-signature = "3"
solana-signer = "4"
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction = { version = "6", features = ["wincode"] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
wincode = "0.6"
yaml_serde = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
